[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrz-checkdigit"
dynamic = ["version"]
description = "Validate passport and ID card MRZ check digits (ICAO 9303: TD1, TD2, TD3)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ali Ahmed" }]
keywords = ["mrz", "passport", "icao", "icao-9303", "check-digit", "ocr", "kyc", "id-card"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://aliahmed.si/"
Documentation = "https://aliahmed.si/blog/passport-mrz-check-digits/"
Source = "https://github.com/QuantumBreakz/mrz-checkdigit"
Issues = "https://github.com/QuantumBreakz/mrz-checkdigit/issues"

[project.scripts]
mrz-checkdigit = "mrz_checkdigit:main"

[tool.hatch.version]
path = "src/mrz_checkdigit/__init__.py"
